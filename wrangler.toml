name = "jarvis-personal-ai"
main = "worker.js"
compatibility_date = "2026-11-19"

[ai]
binding = "AI"

[vars]
OPENJARVIS_MODEL = "gemini-2.5-flash"

[[d1_databases]]
binding = "DB"
database_name = "jarvis-chat-memory"
database_id = "daeb8a90-5f85-466a-9522-04a97dc07742"

[observability]
enabled = true
head_sampling_rate = 0.1
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1.0

[observability.traces]
enabled = true
head_sampling_rate = 0.05
