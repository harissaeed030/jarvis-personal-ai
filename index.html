<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080d18">
  <meta name="description" content="JARVIS — your personal AI assistant.">
  <title>JARVIS — Personal AI</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><div class="orb">J</div><div><strong>JARVIS</strong><small>PERSONAL AI ASSISTANT</small></div></div>
      <span class="status"><i></i> READY</span>
    </header>
    <section class="welcome" id="welcome">
      <div class="eyebrow">YOUR PERSONAL INTELLIGENCE</div>
      <h1>How can I help<br><span>you today?</span></h1>
      <p>Ask in Roman Urdu, Urdu, or English.</p>
      <div class="suggestions">
        <button class="suggestion" data-prompt="Explain something in simple Roman Urdu">✦ Explain a topic</button>
        <button class="suggestion" data-prompt="Help me plan my day">◷ Plan my day</button>
        <button class="suggestion" data-prompt="Give me ideas for my business">⌘ Business ideas</button>
      </div>
    </section>
    <section class="chat" id="chat" aria-live="polite"></section>
    <form class="composer" id="composer">
      <textarea id="prompt" rows="1" placeholder="Message JARVIS..." aria-label="Message JARVIS"></textarea>
      <button id="send" type="submit" aria-label="Send message">↑</button>
    </form>
    <footer>JARVIS AI <span>•</span> Your assistant, your workspace</footer>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
