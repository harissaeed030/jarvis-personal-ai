name: Validate JARVIS
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker syntax
        run: node --check worker.js
      - name: Check browser JavaScript syntax
        run: node --check app.js

      - name: Check embedded browser JavaScript
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const source = readFileSync('worker.js', 'utf8');
          const html = source.match(/const html = `([\s\S]*?)`;/)?.[1];
          if (!html) throw new Error('Worker HTML template not found');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if (!scripts.length) throw new Error('No inline browser scripts found');
          for (const [index, match] of scripts.entries()) {
            try { new Function(match[1]); } catch (error) { throw new Error(`Inline browser script ${index + 1}: ${error.message}`); }
          }
          console.log(`Validated ${scripts.length} inline browser script(s).`);
          NODE
      - name: Check Phase 2 integration surfaces
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const source = readFileSync('worker.js', 'utf8');
          for (const marker of ['u.pathname==="/api/memory"', 'user_memories', 'owner_id', 'accountScope', 'ensureOwnerScope', 'req.method==="PUT"', 'memory_owner_unique_v1', 'OPENJARVIS_API_URL', 'OPENJARVIS_API_KEY', '/v1/chat/completions', '/api/openjarvis/status', '/v1/models', 'base+"/health"', 'OpenJarvis fallback', 'AbortSignal.timeout(15000)', 'non-JSON response', 'id="voice-language"', 'ur-PK', 'Microphone permission is blocked', 'Speech recognition service is unavailable', 'Spoken replies are not supported', 'Voice input could not start']) {
            if (!source.includes(marker)) throw new Error(`Phase 2 integration marker missing: ${marker}`);
          }
          if (!source.includes('USER-SAVED MEMORY')) throw new Error('Saved memory is not included in the assistant context.');
          console.log('Saved-memory API and optional OpenJarvis bridge markers passed.');
          NODE
      - name: Test persistent owner-scoped memory semantics
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Live Worker smoke test
        run: |
          node --input-type=module <<'NODE'
          const base = "https://jarvis-personal-ai.harissaeed030.workers.dev";
          const health = await fetch(`${base}/api/health`);
          if (!health.ok) throw new Error(`Health endpoint returned ${health.status}`);
          const data = await health.json();
          for (const key of ["aiConfigured", "databaseConfigured", "authenticationConfigured"]) {
            if (data[key] !== true) throw new Error(`Worker binding missing: ${key}`);
          }
          const home = await fetch(base);
          if (!home.ok) throw new Error(`Home page returned ${home.status}`);
          const html = await home.text();
          for (const marker of ['id="voice"', 'id="speak"', 'id="research"', 'id="login"', 'id="memory-button"', 'id="memory-panel"', 'id="memory-form"', 'id="voice-language"']) {
            if (!html.includes(marker)) throw new Error(`UI feature missing: ${marker}`);
          }
          if (!html.includes('rel="manifest"') || !html.includes('serviceWorker.register("/sw.js")')) throw new Error("PWA install hooks missing from home page.");
          const manifestResponse = await fetch(`${base}/manifest.webmanifest`);
          if (!manifestResponse.ok) throw new Error(`Manifest returned ${manifestResponse.status}`);
          const manifest = await manifestResponse.json();
          if (manifest.display !== "standalone" || !manifest.icons?.some(icon => icon.src === "/icon.svg")) throw new Error("PWA manifest is incomplete.");
          const iconResponse = await fetch(`${base}/icon.svg`);
          if (!iconResponse.ok || !iconResponse.headers.get("content-type")?.includes("image/svg+xml")) throw new Error("PWA icon endpoint is unavailable.");
          const swResponse = await fetch(`${base}/sw.js`);
          const swText = await swResponse.text();
          if (!swResponse.ok || !swText.includes("jarvis-shell-v1") || !swText.includes("/api/")) throw new Error("PWA service worker is unavailable or unsafe.");
          const checks = [
            ["/api/session", {}],
            ["/api/history", {}],
            ["/api/memory", {}],
            ["/api/openjarvis/status", {}],
            ["/api/memory", {}],
            ["/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: "anonymous smoke test" }) }],
            ["/api/memory", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ content: "unauthorized update test" }) }],
            ["/api/openjarvis/status", {}],
          ];
          for (const [path, init] of checks) {
            const response = await fetch(`${base}${path}?smoke=${Date.now()}-${Math.random()}`, { ...init, cache: "no-store", headers: { ...(init.headers || {}), "Cache-Control": "no-cache", "Cookie": "jarvis_session=definitely-invalid" } });
            const body = await response.text();
            if (response.status !== 401) throw new Error(`${path} must reject invalid sessions with 401; got ${response.status}: ${body.slice(0, 120)}`);
            if (!response.headers.get("cache-control")?.includes("no-store")) throw new Error(`${path} response is missing no-store cache protection.`);
          }
          const csrf = await fetch(`${base}/api/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Origin": "https://attacker.example" },
            body: JSON.stringify({ password: "invalid" }),
            cache: "no-store"
          });
          if (csrf.status !== 403) throw new Error(`Cross-origin login must be blocked with 403; got ${csrf.status}.`);
          if (!csrf.headers.get("cache-control")?.includes("no-store")) throw new Error("Cross-origin rejection is missing no-store cache protection.");
          const memoryCsrf = await fetch(`${base}/api/memory`, { method: "POST", headers: { "Content-Type": "application/json", "Origin": "https://attacker.example" }, body: JSON.stringify({ content: "cross-origin memory write test" }), cache: "no-store" });
          if (memoryCsrf.status !== 403) throw new Error(`Cross-origin memory writes must be blocked with 403; got ${memoryCsrf.status}.`);
          if (!memoryCsrf.headers.get("cache-control")?.includes("no-store")) throw new Error("Cross-origin memory rejection is missing no-store cache protection.");
          console.log("Live JARVIS health, bindings, PWA, private-response cache protection, and cross-origin request checks passed.");
          NODE
