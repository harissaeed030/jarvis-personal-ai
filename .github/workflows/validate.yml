name: Validate JARVIS
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker syntax
        run: node --check worker.js
      - name: Check browser JavaScript syntax
        run: node --check app.js
      - name: Live Worker smoke test
        run: |
          node --input-type=module <<'NODE'
          const base = "https://jarvis-personal-ai.harissaeed030.workers.dev";
          const health = await fetch(`${base}/api/health`);
          if (!health.ok) throw new Error(`Health endpoint returned ${health.status}`);
          const data = await health.json();
          for (const key of ["aiConfigured", "databaseConfigured", "authenticationConfigured"]) {
            if (data[key] !== true) throw new Error(`Worker binding missing: ${key}`);
          }
          const home = await fetch(base);
          if (!home.ok) throw new Error(`Home page returned ${home.status}`);
          const html = await home.text();
          for (const marker of ['id="voice"', 'id="speak"', 'id="research"', 'id="login"']) {
            if (!html.includes(marker)) throw new Error(`UI feature missing: ${marker}`);
          }
          const sessionResponse = await fetch(`${base}/api/session?smoke=${Date.now()}-${Math.random()}`, { cache: "no-store", headers: { "Cache-Control": "no-cache" } });
          if (!sessionResponse.headers.get("cache-control")?.includes("no-store")) {
            throw new Error("Private session response is missing no-store cache protection.");
          }
          const historyResponse = await fetch(`${base}/api/history?smoke=${Date.now()}-${Math.random()}`, { cache: "no-store", headers: { "Cache-Control": "no-cache" } });
          if (!historyResponse.headers.get("cache-control")?.includes("no-store")) {
            throw new Error("Private history response is missing no-store cache protection.");
          }
          console.log("Live JARVIS health, bindings, UI, and private-response cache protection passed.");
          NODE
